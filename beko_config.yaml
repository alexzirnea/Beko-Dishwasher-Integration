esphome:
  name: esphome-web-60b030
  friendly_name: Beko Washing Machine
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c3
  framework:
    type: arduino

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: 
      - beko_dishwasher

# The custom component config
beko_dishwasher:
  clk_pin: 3
  mosi_pin: 4
  status:
    name: Status
  power_on:
    name: Power On
  running:
    name: Running
  half_load:
    name: Half Load
  extra_rinse:
    name: Extra Rinse
  program:
    name: Program
  remaining_time:
    name: Remaining Time (H:MM)
  remaining_time_minutes:
    name: Remaining Time
  raw_mosi:
    name: Raw MOSI Frame